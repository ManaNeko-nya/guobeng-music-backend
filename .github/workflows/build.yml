name: build

# 触发方式：
#   1) 网页手动跑：仓库页 -> Actions -> 左侧 build -> Run workflow
#   2) 推 tag 自动跑：git tag v1.0 && git push origin v1.0
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    # 私有仓库拿不到免费的 arm64 机器，两个架构都在 x86_64 上交叉编译。
    # 目标选 musl 而非 gnu：完全静态链接，产物不依赖目标机的 glibc 版本，
    # 从 CentOS 7 到最新发行版、以及 Termux 都能直接跑。
    # cross 的官方镜像里 musl 交叉工具链是配好的（libsqlite3-sys 与 ring
    # 都要编译 C 代码，自己搭 sysroot 容易踩头文件路径的坑）。
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustc -vV

      - name: 安装 cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: 编译（静态链接）
        run: |
          cross build --release --locked --target ${{ matrix.target }}
          BIN="target/${{ matrix.target }}/release/music-server"
          file "$BIN"
          ls -lh "$BIN"
          # x86_64 生成 static-pie（带 ASLR），arm64 生成 statically linked，两者都算静态
          if ! file "$BIN" | grep -qE "statically linked|static-pie linked"; then
            echo "::error::产物不是静态链接，换了 musl 目标却没有静态化"
            exit 1
          fi
          echo "确认：静态链接"
          mkdir -p dist
          mv "$BIN" "dist/music-server-linux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: music-server-linux-${{ matrix.arch }}
          path: dist/music-server-linux-${{ matrix.arch }}
          if-no-files-found: error

  windows:
    name: windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -vV

      - name: 编译
        env:
          # 静态链接 C 运行库，产物不依赖 VCRUNTIME140.dll
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked

      - name: 检查产物
        run: |
          $exe = Get-Item target\release\music-server.exe
          "{0}  {1} bytes" -f $exe.Name, $exe.Length

      - name: 打包
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\music-server.exe dist\music-server-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: music-server-windows-x86_64
          path: dist/music-server-windows-x86_64.exe
          if-no-files-found: error
