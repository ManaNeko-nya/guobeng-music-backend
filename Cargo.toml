[package]
name = "music-server"
version = "2.0.0"
edition = "2021"
rust-version = "1.80"
description = "个人音乐库后端：艺人 / 专辑 / 歌曲 / 歌词 / 收藏 / 历史 / 账户"
license = "MIT"

[[bin]]
name = "music-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
jsonwebtoken = "9"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# 依赖在 dev 构建下也做优化：sha2/pbkdf2 未优化时登录要 8 秒
[profile.dev.package."*"]
opt-level = 3
